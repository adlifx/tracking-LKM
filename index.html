<meta name="theme-color" content="#173b79">
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--text:#1a1d23;--muted:#6b7280;--border:#e3e5e9;
  --accent:#2563eb;--accent-text:#ffffff;--danger:#dc2626;--danger-bg:#fef2f2;
  --ok:#16a34a;--ok-bg:#f0fdf4;--warn-bg:#fffbeb;--warn:#b45309;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;--panel:#1a1d23;--text:#e8e9ec;--muted:#9aa0ab;--border:#2b2f38;
    --accent:#3b82f6;--accent-text:#fff;--danger:#f87171;--danger-bg:#2a1516;
    --ok:#4ade80;--ok-bg:#122016;--warn-bg:#2a2110;--warn:#facc15;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:900px;margin:0 auto;padding:16px;}
h1,h2,h3{margin:0 0 8px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px;}
input,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:15px;}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;background:var(--accent);color:var(--accent-text);}
button.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
button:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.tabs button{background:var(--panel);color:var(--muted);border:1px solid var(--border);white-space:nowrap;}
.tabs button.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.stat{display:flex;flex-direction:column;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;min-width:120px;flex:1;}
.stat b{font-size:24px;}
.stat span{font-size:12px;color:var(--muted);}
.grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:13px;text-transform:uppercase;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.err{background:var(--danger-bg);color:var(--danger);}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px;}
.msg.err{background:var(--danger-bg);color:var(--danger);}
.msg.ok{background:var(--ok-bg);color:var(--ok);}
.muted{color:var(--muted);font-size:13px;}
.small{font-size:12px;color:var(--muted);}
.scroll-x{overflow-x:auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
a.linklike{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-size:inherit;}

.scan-only{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:12px;color:var(--accent);background:var(--panel);}
.preview{padding:14px;border:1px solid var(--border);border-radius:8px;margin-top:16px;background:var(--bg);}
.preview strong{display:block;font-size:19px;margin-bottom:8px;}
.scan-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
@media(max-width:600px){.wrap{padding:12px}.topbar{align-items:flex-start;gap:12px;flex-wrap:wrap}.tabs button{padding:10px 12px}.stat{min-width:44%}.scan-actions button{flex:1}.row button{min-height:42px}}

/* JPJ identity and touch-friendly layouts, shared by every screen. */
body{min-height:100vh;min-height:100dvh;line-height:1.5;}
#pageWatermark{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center;overflow:hidden;}
#pageWatermark img{width:min(58vw,410px);height:auto;opacity:.055;user-select:none;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand-logo{width:58px;height:58px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:9px;padding:3px;}
.brand h1{font-size:20px;line-height:1.25;overflow-wrap:anywhere;}
.login-shell{max-width:430px;margin:0 auto;padding:clamp(16px,7vh,64px) 0;}
.login-card{padding:28px;}
.login-brand{text-align:center;margin-bottom:20px;}
.login-brand .brand-logo{width:100px;height:100px;margin-bottom:12px;}
.login-brand h1{font-size:23px;line-height:1.3;}
.login-card button{width:100%;}
button,input,select{min-height:44px;}
input,select{font-size:16px;}
button{touch-action:manipulation;}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.muted{font-size:14px;}
.stat span{font-size:14px;}
.card,.preview,.brand,.topbar>div{min-width:0;}
.card p,.preview,p.small,.account-email{overflow-wrap:anywhere;}
.topbar{gap:16px;flex-wrap:wrap;}
.account{margin-left:auto;min-width:0;max-width:100%;justify-content:flex-end;}
.account-email{min-width:0;flex:1;}
.scroll-x{max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;}
.scroll-x table{min-width:520px;}
a.linklike{display:inline-block;min-height:44px;padding:10px 0;}
.tabs{flex-wrap:wrap;overflow:visible;}
.tabs button{flex:1 0 auto;}
#scannerHint{text-align:center;overflow-wrap:anywhere;max-width:100%;}
@media(max-width:600px){
 .wrap{padding:12px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
 .brand-logo{width:48px;height:48px;}.brand h1{font-size:18px;}
 .account{width:100%;justify-content:space-between;}
 .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
 .tabs button{white-space:normal;padding:10px 8px;}
 .card{padding:14px;}.login-card{padding:22px;}
 .row button{flex:1 1 auto;white-space:normal;}
 .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}.stat{min-width:0;padding:12px;}
 .stat b{font-size:clamp(21px,6vw,28px);overflow-wrap:anywhere;}
 .login-brand h1{font-size:21px;}
 #pageWatermark img{width:72vw;}
}
@media(prefers-color-scheme:dark){#pageWatermark img{opacity:.08;}}
@media print{#pageWatermark{position:fixed;}#pageWatermark img{opacity:.05;}}

</style>

<script>
// ============================================================
// CONFIG — fill these in from Supabase → Project Settings → API
// ============================================================
const SUPABASE_URL = 'https://mjozpneaekfwietgawky.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_T3KnQ-r8PytVAfktsJJu1g_6z-1r7Jq';

const DEFAULT_ENV_PER_BOX = 200, DEFAULT_LKM_PER_ENV = 50, DEFAULT_PREFIX = 'A', DEFAULT_DIGITS = 7;

let sb = null;
let session = null; // {email}
let route = 'dashboard';
let flash = null;
let flashTimer=null, renderVersion=0, pendingBoxScan=null, dispatchSubmitting=false;

function initSb(){ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

// ---------- Row <-> app object mapping ----------
function boxFromRow(r){ return {id:r.id, boxNum:r.box_num, envPerBox:r.env_per_box, lkmPerEnv:r.lkm_per_env, prefix:r.prefix, digits:r.digits, envStart:r.env_start, envEnd:r.env_end, expectedEnvelopes:r.expected_envelopes, receivedEnvelopes:r.received_envelopes, status:r.status, createdAt:r.created_at}; }
function envFromRow(r){ return {id:r.id, envNum:r.env_num, boxQr:r.box_id, serialStart:r.serial_start, serialEnd:r.serial_end, lkmStartNum:r.lkm_start_num, lkmEndNum:r.lkm_end_num, count:r.count, status:r.status, branch:r.branch, receivedAt:r.received_at, dispatchedAt:r.dispatched_at}; }
function dispatchFromRow(r){ return {id:r.id, branch:r.branch, envelopeQrs:r.envelope_ids, totalLkm:r.total_lkm, date:r.date}; }

async function readAll(table,order,ascending=true){
  const rows=[];
  for(let offset=0;;offset+=1000){
    const {data,error}=await sb.from(table).select('*').order(order,{ascending}).range(offset,offset+999);
    if(error) throw new Error('Could not load '+table+': '+error.message);
    rows.push(...data); if(data.length<1000) return rows;
  }
}
async function getAllBoxes(){ return (await readAll('boxes','box_num')).map(boxFromRow); }
async function getAllEnvelopes(){ return (await readAll('envelopes','env_num')).map(envFromRow); }
async function getAllDispatches(){ return (await readAll('dispatches','date',false)).map(dispatchFromRow); }
function setFlash(type,text){ flash={type,text}; clearTimeout(flashTimer); render(); }

// ---------- Sequencing helpers ----------
function padNum(n,width){ return String(n).padStart(width,'0'); }
function parsePackageQr(raw,expectedKind){
  const value=String(raw).split('|')[0].trim();
  let kind=null,number;
  const typed=value.match(/^(BOX|B|KOTAK|ENVELOPE|ENV|E|SAMPUL)[\s#:_-]*(\d+)$/i);
  if(typed){kind=/^(BOX|B|KOTAK)$/i.test(typed[1])?'box':'envelope';number=Number(typed[2]);}
  else if(/^\d+$/.test(value)&&expectedKind){kind=expectedKind;number=Number(value);}
  else throw new Error('Unrecognised QR. Use a box QR such as B000001 or an envelope QR such as E000001.');
  if(expectedKind&&kind!==expectedKind)throw new Error('This is a '+kind+' QR. Please use the '+kind+' scan button.');
  if(!Number.isSafeInteger(number)||number<1||number>999999)throw new Error('Invalid package number in QR code.');
  return {kind,number,id:(kind==='box'?'B':'E')+padNum(number,6)};
}
const malaysiaDate=value=>new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kuala_Lumpur',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(value));
function envRangeForBox(boxNum, envPerBox){ const s=(boxNum-1)*envPerBox+1; return [s, s+envPerBox-1]; }
function lkmNumsForEnvelope(envNum, lkmPerEnv){ const s=(envNum-1)*lkmPerEnv+1; return [s, s+lkmPerEnv-1]; }
function formatSerial(num, prefix, digits){ return prefix + padNum(num, digits); }

// ---------- Auth ----------
async function tryLogin(email,password){
  const {data,error} = await sb.auth.signInWithPassword({email,password});
  if(error){ setFlash('err', error.message); return; }
  session = {email:data.user.email};
  route='dashboard'; render();
}
async function logout(){ closeScanner(false); await sb.auth.signOut(); session=null; pendingBoxScan=null; dispatchSelection.clear(); verifyResult=null; render(); }

// ---------- Views ----------
function loginView(){
  return `

function tabsBar(){
  const tabs = [
    ['dashboard','Dashboard'],['receive','Receive Box'],['verify','Verify Envelope'],
    ['inventory','Inventory'],['dispatch','Dispatch'],['branches','Branch Totals'],
  ];
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="${route===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}</div>`;
}

async function dashboardView(){
  const boxes = await getAllBoxes();
  const envs = await getAllEnvelopes();
  const atHqEnvs = envs.filter(e=>e.status==='at_hq');
  const dispatchedEnvs = envs.filter(e=>e.status==='dispatched');
  const lkmAtHq = atHqEnvs.reduce((s,e)=>s+(e.count||0),0);
  const lkmDispatched = dispatchedEnvs.reduce((s,e)=>s+(e.count||0),0);
  return `
  <div class="grid">
    <div class="stat"><b>${boxes.length}</b><span>Boxes received</span></div>
    <div class="stat"><b>${envs.length}</b><span>Envelopes registered</span></div>
    <div class="stat"><b>${lkmAtHq}</b><span>LKM at HQ</span></div>
    <div class="stat"><b>${lkmDispatched}</b><span>LKM dispatched</span></div>
  </div>
  <div class="card"><h3>Recent boxes</h3>${renderBoxTable(boxes.slice(-8).reverse())}</div>`;
}
function renderBoxTable(boxes){
  if(!boxes.length) return `<p class="muted">None.</p>`;
  return `<div class="scroll-x"><table><thead><tr><th>Box #</th><th>Envelopes</th><th>Status</th></tr></thead><tbody>
    ${boxes.map(b=>`<tr><td><a class="linklike" onclick="go('inventory',${esc(JSON.stringify(b.id))})">#${b.boxNum} (${esc(b.id)})</a></td><td>${b.receivedEnvelopes||0} / ${b.expectedEnvelopes}</td><td>${statusBadge(b.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function statusBadge(status){
  if(status==='complete') return `<span class="badge ok">At HQ</span>`;
  if(status==='dispatched') return `<span class="badge err">Dispatched</span>`;
  if(status==='at_hq') return `<span class="badge ok">At HQ</span>`;
  return `<span class="badge">${esc(status||'-')}</span>`;
}

// ---- Receive box: one scan, auto-fills everything ----
let boxSubmitting = false;
async function receiveView(){
  return `
  <div class="card">
    <h2>Receive Box</h2>
    <p class="muted">Scan the box QR, check the read-only contents, then confirm receipt. There is no manual code entry.</p>
    
    <div class="row" style="margin-top:10px;">
      <button type="button" onclick="openScanner('once', code => previewBoxScan(code))" ${boxSubmitting?'disabled':''}>${boxSubmitting?'Receiving box…':'Scan box QR with camera'}</button>
    </div>
    <p class="small" style="margin-top:12px;">Box #1 → envelopes 1–${DEFAULT_ENV_PER_BOX} → LKM ${DEFAULT_PREFIX}${padNum(1,DEFAULT_DIGITS)}–${DEFAULT_PREFIX}${padNum(DEFAULT_ENV_PER_BOX*DEFAULT_LKM_PER_ENV,DEFAULT_DIGITS)}. Box #2 continues automatically from there.</p>
  </div>
  ${pendingBoxScan?renderReceivePreview():''}
  <div class="card"><h3>Need to check a specific envelope?</h3><p class="muted">Use the <a class="linklike" onclick="go('verify')">Verify Envelope</a> tab.</p></div>`;
}

function previewBoxScan(code){
 const parsed=parsePackageQr(code,'box');pendingBoxScan=parsed;flash=null;
}
function renderReceivePreview(){
 const n=pendingBoxScan.number;const [first,last]=envRangeForBox(n,200);const [serialFirst]=lkmNumsForEnvelope(first,50);const [,serialLast]=lkmNumsForEnvelope(last,50);
 return `<div class="card preview"><h3>Check scanned box</h3><strong>${esc(pendingBoxScan.id)}</strong><p>200 envelopes (#${first}–#${last}) · 10,000 LKM</p><p>${formatSerial(serialFirst,DEFAULT_PREFIX,DEFAULT_DIGITS)} – ${formatSerial(serialLast,DEFAULT_PREFIX,DEFAULT_DIGITS)}</p><p class="muted">Confirm that the physical packing and serial range match this record.</p><div class="row" style="margin-top:14px"><button onclick="submitBoxScan()" ${boxSubmitting?'disabled':''}>${boxSubmitting?'Saving…':'Confirm receive 10,000 LKM'}</button><button class="secondary" onclick="pendingBoxScan=null;render()" ${boxSubmitting?'disabled':''}>Cancel</button></div></div>`;
}
async function submitBoxScan(){
  if(boxSubmitting||!pendingBoxScan)return;
  boxSubmitting=true;render();
  const boxNum=pendingBoxScan.number,envPerBox=200,lkmPerEnv=50,prefix=DEFAULT_PREFIX,digits=DEFAULT_DIGITS;
  const id='B'+padNum(boxNum,6);
  try{
    const boxes=await getAllBoxes();
    if(boxes.some(b=>b.id===id))throw new Error('Box '+id+' has already been received / registered.');
    const [envStart,envEnd]=envRangeForBox(boxNum,envPerBox);
    const [lkmStart]=lkmNumsForEnvelope(envStart,lkmPerEnv),[,lkmEnd]=lkmNumsForEnvelope(envEnd,lkmPerEnv);
    const allEnvs=await getAllEnvelopes();
    const clash=allEnvs.find(e=>(e.envNum>=envStart&&e.envNum<=envEnd)||!(lkmEnd<e.lkmStartNum||e.lkmEndNum<lkmStart));
    if(clash)throw new Error('Envelope '+clash.id+' already occupies this envelope or serial range.');
    const now=new Date().toISOString();
    const {error:boxErr}=await sb.from('boxes').insert({id,box_num:boxNum,env_per_box:envPerBox,lkm_per_env:lkmPerEnv,prefix,digits,env_start:envStart,env_end:envEnd,expected_envelopes:envPerBox,received_envelopes:envPerBox,status:'complete',created_at:now});
    if(boxErr)throw boxErr;
    const rows=[];
    for(let envNum=envStart;envNum<=envEnd;envNum++){
      const [lkmS,lkmE]=lkmNumsForEnvelope(envNum,lkmPerEnv);
      rows.push({id:'E'+padNum(envNum,6),env_num:envNum,box_id:id,serial_start:formatSerial(lkmS,prefix,digits),serial_end:formatSerial(lkmE,prefix,digits),lkm_start_num:lkmS,lkm_end_num:lkmE,count:lkmPerEnv,status:'at_hq',received_at:now});
    }
    const {error:envErr}=await sb.from('envelopes').insert(rows);
    if(envErr)throw new Error(envErr.message+' The box header was saved, but its envelopes were not. Ask the administrator to reconcile this box before retrying.');
    pendingBoxScan=null;route='dashboard';flash={type:'ok',text:'Received '+id+': 200 envelopes, 10,000 LKM ('+formatSerial(lkmStart,prefix,digits)+' – '+formatSerial(lkmEnd,prefix,digits)+').'};
  }catch(error){flash={type:'err',text:'Failed to save: '+(error.message||String(error))};}
  finally{boxSubmitting=false;render();}
}

// ---- Verify Envelope (read-only spot-check) ----
let verifyResult = null;
async function verifyView(){
  return `
  <div class="card">
    <h2>Verify Envelope</h2>
    <p class="muted">Spot-check any envelope or box already in the system — this does not affect receiving or inventory.</p>
    
    <div class="row" style="margin-top:10px;">
      <button type="button" onclick="openScanner('once', code => verifyCode(code,'envelope'))">Scan envelope QR</button><button type="button" class="secondary" onclick="openScanner('once', code => verifyCode(code,'box'))">Scan box QR</button>
    </div>
  </div>
  ${verifyResult ? renderVerifyResult(verifyResult) : ''}`;
}
function renderVerifyResult(r){
  if(r.type==='envelope'){
    const e=r.data;
    return `<div class="card"><h3>Envelope #${e.envNum}</h3><table>
      <tr><th>Box</th><td>${r.box?`#${r.box.boxNum} (${esc(r.box.id)})`:esc(e.boxQr)}</td></tr>
      <tr><th>Serial range</th><td>${esc(e.serialStart)} – ${esc(e.serialEnd)}</td></tr>
      <tr><th>Qty</th><td>${e.count}</td></tr>
      <tr><th>Status</th><td>${statusBadge(e.status)}</td></tr>
      <tr><th>Branch</th><td>${esc(e.branch||'-')}</td></tr>
    </table></div>`;
  }
  if(r.type==='box'){
    const b=r.data;
    return `<div class="card"><h3>Box #${b.boxNum} (${esc(b.id)})</h3><table>
      <tr><th>Envelope range</th><td>#${b.envStart} – #${b.envEnd}</td></tr>
      <tr><th>Received</th><td>${b.receivedEnvelopes}/${b.expectedEnvelopes}</td></tr>
      <tr><th>Status</th><td>${statusBadge(b.status)}</td></tr>
    </table></div>`;
  }
  return `<div class="card"><p class="muted">Nothing found for that code.</p></div>`;
}
async function verifyCode(code,expectedKind){
  const parsed=parsePackageQr(code,expectedKind);verifyResult=null;
  if(parsed.kind==='envelope'){
    const envs=await getAllEnvelopes();const envelope=envs.find(e=>e.id===parsed.id);
    if(envelope){const boxes=await getAllBoxes();verifyResult={type:'envelope',data:envelope,box:boxes.find(b=>b.id===envelope.boxQr)};return;}
  }else{const boxes=await getAllBoxes();const box=boxes.find(b=>b.id===parsed.id);if(box){verifyResult={type:'box',data:box};return;}}
  verifyResult={type:'none'};throw new Error('No registered '+parsed.kind+' found for '+parsed.id+'.');
}

// ---- Inventory ----

  const boxes = await getAllBoxes();
  const envs = await getAllEnvelopes();
  return `
  <div class="card"><h2>Inventory</h2>
  <div class="scroll-x"><table><thead><tr><th>Box #</th><th>Envelopes</th><th>LKM total</th><th>At HQ</th><th>Sent</th><th>Status</th><th></th></tr></thead><tbody>
  ${boxes.map(b=>{
    const be = envs.filter(e=>e.boxQr===b.id).sort((a,b2)=>a.envNum-b2.envNum);

    <td><a class="linklike" onclick="toggleBoxDetail(${esc(JSON.stringify(b.id))})">${inventoryFocusBox===b.id?'Hide':'View'}</a></td></tr>
    ${inventoryFocusBox===b.id ? `<tr><td colspan="7"><div class="scroll-x"><table><thead><tr><th>Envelope #</th><th>Serial range</th><th>Qty</th><th>Status</th><th>Branch</th></tr></thead><tbody>
      ${be.map(e=>`<tr><td>${e.envNum}</td><td>${esc(e.serialStart)}–${esc(e.serialEnd)}</td><td>${e.count}</td><td>${statusBadge(e.status)}</td><td>${esc(e.branch||'-')}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No envelopes.</td></tr>'}

// ---- Dispatch ----
let dispatchSelection = new Set();
async function dispatchView(){
  const envs = (await getAllEnvelopes()).filter(e=>e.status==='at_hq');
  return `
  <div class="card">
    <h2>Dispatch to Branch</h2>
    
    <div class="row" style="margin-top:10px;">
      <button type="button" onclick="openScanner('continuous', code => addToDispatch(code,'box'))">Scan box QR</button><button type="button" onclick="openScanner('continuous', code => addToDispatch(code,'envelope'))">Scan envelope QR</button>
    </div>
    <p class="muted">Keep the camera open to scan several packages. Scanning an already selected package never adds it twice.</p><h3 style="margin-top:16px;">Selected (${dispatchSelection.size} envelope${dispatchSelection.size===1?'':'s'}, ${sumSelected(envs)} LKM)</h3>
    ${dispatchSelection.size ? `<div class="scroll-x"><table><thead><tr><th>Envelope #</th><th>Box</th><th>Serial range</th><th>Qty</th></tr></thead><tbody>
      ${[...dispatchSelection].map(id=>{const e=envs.find(x=>x.id===id); if(!e) return ''; return `<tr><td>${e.envNum}</td><td>${esc(e.boxQr)}</td><td>${esc(e.serialStart)}–${esc(e.serialEnd)}</td><td>${e.count}</td></tr>`;}).join('')}
    </tbody></table></div>` : `<p class="muted">Nothing selected yet.</p>`}
    <div class="preview">HQ remaining after this dispatch: <strong>${envs.reduce((n,e)=>n+e.count,0)-sumSelected(envs)} LKM</strong></div>
    <form id="confirmDispatchForm" style="margin-top:14px;">
      <label for="branch-name">Destination branch</label>
      <input id="branch-name" name="branch" maxlength="120" placeholder="e.g. JPJ Cawangan Shah Alam" required>
      <div class="row" style="margin-top:12px;">
        <button type="submit" ${dispatchSelection.size&&!dispatchSubmitting?'':'disabled'}>${dispatchSubmitting?'Saving…':'Confirm dispatch'}</button>
        <button type="button" class="secondary" onclick="dispatchSelection=new Set();render();">Clear selection</button>
      </div>
    </form>
  </div>`;
}
function sumSelected(envs){ let s=0; dispatchSelection.forEach(id=>{const e=envs.find(x=>x.id===id); if(e) s+=e.count;}); return s; }

async function addToDispatch(code,expectedKind){
  const parsed=parsePackageQr(code,expectedKind);const envs=await getAllEnvelopes();
  if(parsed.kind==='box'){
    const boxes=await getAllBoxes();const box=boxes.find(b=>b.id===parsed.id);
    if(!box)throw new Error('Box '+parsed.id+' has not been received.');
    const available=envs.filter(e=>e.boxQr===box.id&&e.status==='at_hq');
    if(!available.length)throw new Error('No envelopes from '+box.id+' remain at HQ.');
    const previous=dispatchSelection.size;available.forEach(e=>dispatchSelection.add(e.id));
    flash={type:'ok',text:'Added '+(dispatchSelection.size-previous)+' new envelopes from '+box.id+'.'};return flash.text;
  }
  const envelope=envs.find(e=>e.id===parsed.id);
  if(!envelope)throw new Error('Envelope '+parsed.id+' has not been received.');
  if(envelope.status!=='at_hq')throw new Error('Envelope '+parsed.id+' is no longer at HQ.');
  const already=dispatchSelection.has(envelope.id);dispatchSelection.add(envelope.id);
  flash={type:'ok',text:already?envelope.id+' is already selected.':'Added '+envelope.id+' · '+envelope.count+' LKM.'};return flash.text;
}

async function confirmDispatch(branch){
  if(dispatchSubmitting||!dispatchSelection.size)return;
  if(!branch||branch.length>120){setFlash('err','Enter a destination branch (up to 120 characters).');return;}
  dispatchSubmitting=true;
  try{
  const envs = await getAllEnvelopes();
  const selected = envs.filter(e=>dispatchSelection.has(e.id)&&e.status==='at_hq');
  if(selected.length!==dispatchSelection.size)throw new Error('Stock changed since scanning. Clear the selection and rescan.');
  const total = selected.reduce((s,e)=>s+e.count,0);
  const now = new Date().toISOString();
  const ids = selected.map(e=>e.id);
  const {data:moved,error:e1} = await sb.from('envelopes').update({status:'dispatched', branch, dispatched_at:now}).in('id', ids).eq('status','at_hq').select('id');
  if(e1)throw e1;
  if(!moved?.length)throw new Error('These envelopes were already dispatched. Clear the selection and rescan.');
  const movedIds=moved.map(e=>e.id);
  const movedTotal=selected.filter(e=>movedIds.includes(e.id)).reduce((n,e)=>n+e.count,0);
  const boxes = await getAllBoxes();
  const allEnvs = await getAllEnvelopes();
  const boxesToClose = boxes.filter(b=>{
    const be = allEnvs.filter(e=>e.boxQr===b.id);
    return be.length && be.every(e=>e.status==='dispatched');
  }).map(b=>b.id);
  if(boxesToClose.length){ await sb.from('boxes').update({status:'dispatched'}).in('id', boxesToClose); }
  const {error:historyError}=await sb.from('dispatches').insert({id:'D'+crypto.randomUUID(),branch,envelope_ids:movedIds,total_lkm:movedTotal,date:now});
  if(historyError)throw new Error('Stock was dispatched but its history could not be saved: '+historyError.message+'. Ask the administrator to reconcile before retrying.');
  dispatchSelection = new Set();
  setFlash('ok',`Dispatched ${movedIds.length} envelope(s), ${movedTotal} LKM, to "${branch}".${movedIds.length!==ids.length?' Some envelopes were already taken by another dispatch; only newly moved stock was counted.':''}`);
  route='branches';
  }catch(error){setFlash('err',error.message||String(error));}
  finally{dispatchSubmitting=false;render();}
}

// ---------- QR camera scanner ----------
// mode 'once': closes after first successful scan and calls callback(code).
// mode 'continuous': keeps the camera open after each scan (with a brief cooldown + on-screen
// confirmation) so multiple items can be scanned in a row; user taps "Done / Cancel" to close.
let scannerStream=null,scannerActive=false,scannerMode='once',scannerCallback=null,scannerCooldown=false,scannerGeneration=0;

async function openScanner(mode, callback){
  if(scannerActive||boxSubmitting||dispatchSubmitting)return;
  const generation=++scannerGeneration;
  scannerMode = mode; scannerCallback = callback; scannerCooldown = false;
  document.getElementById('scannerModal').style.display='flex';
  setScannerHint(mode==='continuous' ? 'Point the camera at each QR code — keeps scanning' : 'Point the camera at the QR code');
  if(!window.jsQR){
    closeScanner();
    setFlash('err','QR scanner library failed to load (check your internet connection or ad-blocker), then try again.');
    return;
  }
  try{ scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}}); }
  catch(e){
    try{ scannerStream = await navigator.mediaDevices.getUserMedia({video:true}); }
    catch(e2){ closeScanner(); setFlash('err','Camera access was denied, or this page is not served over HTTPS.'); return; }
  }
  if(generation!==scannerGeneration){scannerStream?.getTracks().forEach(t=>t.stop());scannerStream=null;return;}
  document.getElementById('scannerVideo').srcObject=scannerStream;
  await document.getElementById('scannerVideo').play();
  scannerActive=true; requestAnimationFrame(scanFrame);
}
function closeScanner(refresh=true){
  scannerGeneration++;scannerActive=false;
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream=null; }
  document.getElementById('scannerModal').style.display='none';
  if(refresh)render();
}
function setScannerHint(text){
  const el = document.getElementById('scannerHint');
  if(el) el.textContent = text;
}
function scanFrame(){
  if(!scannerActive) return;
  const video=document.getElementById('scannerVideo'), canvas=document.getElementById('scannerCanvas');
  if(video.readyState===video.HAVE_ENOUGH_DATA && !scannerCooldown){
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    const ctx=canvas.getContext('2d'); ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'attemptBoth'}) : null;
    if(code && code.data){ handleScanResult(code.data); return; }
  }
  requestAnimationFrame(scanFrame);
}
async function handleScanResult(rawData){
  if(!scannerActive||scannerCooldown)return;
  scannerCooldown=true;const callback=scannerCallback,mode=scannerMode;
  if(mode==='once')closeScanner(false);
  try{const message=await callback(rawData);if(mode==='continuous')setScannerHint(message||'QR accepted. Scan the next package.');}
  catch(error){flash={type:'err',text:error.message||String(error)};setScannerHint(flash.text);}
  finally{
    render();
    if(mode==='continuous')setTimeout(()=>{if(!scannerActive)return;scannerCooldown=false;requestAnimationFrame(scanFrame);},1200);
  }
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)closeScanner(false);});
window.addEventListener('pagehide',()=>closeScanner(false));

function attachLoginHandlers(){
  const f = document.getElementById('loginForm');
  if(f) f.addEventListener('submit', e=>{ e.preventDefault(); tryLogin(f.email.value.trim(), f.password.value); });
}
function attachHandlers(){
  const cf=document.getElementById('confirmDispatchForm');
  if(cf)cf.addEventListener('submit',e=>{e.preventDefault();confirmDispatch(cf.branch.value.trim());});
}
let idleTimer;
function resetIdle(){clearTimeout(idleTimer);if(session)idleTimer=setTimeout(()=>{logout();setFlash('err','Session ended after 30 minutes without activity.');},30*60*1000);}
['pointerdown','keydown'].forEach(event=>document.addEventListener(event,resetIdle,{passive:true}));

(async function main(){
  initSb();
  const {data:{session:s}} = await sb.auth.getSession();
  if(s) session = {email:s.user.email};
  sb.auth.onAuthStateChange((_event,s)=>{session=s?{email:s.user.email}:null;resetIdle();render();});
  resetIdle();render();
})();
</script>
